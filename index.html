<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Mes habitudes quotidiennes avec rappels push." />

  <!-- PWA / iOS -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="To-Do" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />

  <link rel="stylesheet" href="/style.css" />
  <title>Ma To-Do</title>
</head>
<body>

  <!-- ====== ECRAN D'ACCUEIL : CITATION DE MOTIVATION ======
       Visible des le chargement. Bloque 5s, puis clic n'importe ou pour entrer. -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <blockquote class="splash-quote" id="splash-quote"></blockquote>
      <cite class="splash-author" id="splash-author"></cite>
    </div>
    <div class="splash-foot">
      <div class="splash-progress"><span id="splash-bar" class="splash-bar"></span></div>
      <p class="splash-hint" id="splash-hint">Un instant&hellip;</p>
    </div>
  </div>

  <!-- ====== APPLICATION ====== -->
  <div id="app" class="app">
    <header class="app-header">
      <div class="app-header-row">
        <h1 class="app-title">Ma To-Do</h1>
      </div>
      <p id="today-label" class="today-label"></p>
    </header>

    <!-- ====== GRAPHIQUE DES HABITUDES (en haut) ====== -->
    <section class="card habits">
      <div class="routine-head">
        <h2 class="section-title">Mes habitudes</h2>
        <span id="habits-avg" class="daily-progress">&mdash;</span>
      </div>
      <div id="habit-chart" class="habit-chart" aria-label="Pourcentage d'habitudes effectuees par jour"></div>
    </section>

    <!-- ====== MATIN ====== -->
    <section class="card group" data-group="matin">
      <div class="routine-head">
        <h2 class="section-title">Matin</h2>
        <span class="daily-progress" data-progress="matin">0/0</span>
      </div>
      <ul class="daily-list" data-list="matin"></ul>
      <form class="daily-add" data-add="matin" autocomplete="off">
        <input type="text" class="daily-input" maxlength="80" placeholder="Ajouter une habitude du matin..." />
        <button type="submit" class="btn-add-sm" aria-label="Ajouter">+</button>
      </form>
    </section>

    <!-- ====== JOURNEE ====== -->
    <section class="card group" data-group="journee">
      <div class="routine-head">
        <h2 class="section-title">Journee</h2>
        <span class="daily-progress" data-progress="journee">0/0</span>
      </div>
      <ul class="daily-list" data-list="journee"></ul>
      <form class="daily-add" data-add="journee" autocomplete="off">
        <input type="text" class="daily-input" maxlength="80" placeholder="Ajouter une habitude de journee..." />
        <button type="submit" class="btn-add-sm" aria-label="Ajouter">+</button>
      </form>
    </section>

    <!-- ====== NOTIFICATIONS (cases a cocher chaque matin) ====== -->
    <section class="card group" data-group="notifications">
      <div class="routine-head">
        <h2 class="section-title">Notifications</h2>
        <span class="daily-progress" data-progress="notifications">0/0</span>
      </div>
      <ul class="daily-list" data-list="notifications"></ul>
      <form class="daily-add" data-add="notifications" autocomplete="off">
        <input type="text" class="daily-input" maxlength="80" placeholder="Ajouter une notification..." />
        <button type="submit" class="btn-add-sm" aria-label="Ajouter">+</button>
      </form>
    </section>

    <!-- Banniere notifications (visible tant qu'elles ne sont pas activees) -->
    <div id="notif-banner" class="notif-banner hidden">
      <div class="notif-text">
        <strong>Notifications push</strong>
        <span id="notif-status">Activez les rappels meme quand l'app est fermee.</span>
      </div>
      <button type="button" id="enable-notif" class="btn-primary">Activer les notifications</button>
    </div>

    <footer class="app-footer">
      <button type="button" id="test-notif" class="btn-ghost hidden">Tester une notification</button>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
